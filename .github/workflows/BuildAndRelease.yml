name: Build and create a release when tag is pushed

# Only deploy when a new tag is pushed
# git tag v0.n
# git push origin v0.n
on:
    push:
        tags:
          - "v*.*-alpha"
          - "v*.*.*"
          - "v*.*"
    workflow_dispatch:

# Must match the project() name in CMakeLists.txt
env:
    APP_NAME: picoGalagino

# Allow this workflow to write back to the repository
permissions:
    contents: write

# Build binary and send to releases
#
# NOTE: the released .uf2 files contain NO game ROM data. The ROM sets are
# supplied by the user on the SD card and are never built, stored or published here.
# updateAll.exe, the ROM set installer for Windows that is released alongside, is
# built from pico-bootLoader and holds no ROM data either: it fetches the sets on
# the user's computer.
jobs:
    build-release:
        runs-on: self-hosted
        name: Build and create release
        steps:

          - name: Check out this repository with submodules
            uses: actions/checkout@v6
            with:
                submodules: recursive

          - name: Update line containing pico_set_program_version() in CMakelists.txt with tag name.
            run: |
                 # Extract the tag name that triggered the event and remove the 'refs/tags/' prefix
                 input_string=${{ github.ref }}
                 prefix="refs/tags/"
                 tag="No versioninfo found"
                 if [[ $input_string == $prefix* ]]; then
                      echo "The string starts with 'refs/tags/'."
                      tag="${input_string#$prefix}"
                      echo "Tag is ${tag}"
                      sed -i "s/^[[:space:]]*pico_set_program_version(.*/pico_set_program_version(${{ env.APP_NAME }} \"$tag\")/" CMakeLists.txt
                      sed -i "s/VX.X/$tag/" pico_shared/menu.h
                 else
                      echo "The string does not start with 'refs/tags/'."
                 fi
                 grep "pico_set_program_version" CMakeLists.txt
                 grep SWVERSION pico_shared/menu.h

          - name: Build all the .uf2 files
            run: |
                 chmod +x build*.sh bld.sh || exit 1
                 export PICO_SDK_PATH=/datalocal/pico/pico-sdk
                 export PICO_PIO_USB_PATH=/datalocal/Pico-PIO-USB
                 ./buildAll.sh

          # updateAll is maintained in pico-bootLoader. Its main branch is used:
          # it knows every set of this application.
          - name: Check out pico-bootLoader, for updateAll.exe
            uses: actions/checkout@v6
            with:
                repository: PicoPlus-devel/pico-bootLoader
                path: pico-bootLoader
                fetch-depth: 0          # tags, so that updateAll.exe gets a version
                filter: blob:none
                sparse-checkout: updateAll

          - name: Build updateAll.exe, the ROM set installer for Windows (needs mingw-w64 on the runner)
            run: |
                 pico-bootLoader/updateAll/win/build.sh

          - name: Create release
            uses: softprops/action-gh-release@v3
            if: startsWith(github.ref, 'refs/tags/')  && github.event_name == 'push'
            with:
              files: |
                releases/*.uf2
                pico-bootLoader/updateAll/win/build/updateAll.exe
              body_path: CHANGELOG.md
